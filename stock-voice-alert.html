<meta name="theme-color" content="#0a0e12" />
<style>
  :root{
    --bg:#0a0e12; --panel:#11161c; --panel2:#161c24; --line:#232b35;
    --text:#e7ecf1; --dim:#7c8a99;
    --up:#ff4d4f; --down:#3b82f6;
    --accent:#20e3b2; --accent-dim:#0d5c49; --warn:#f5b942;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans KR','Pretendard',-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 80%,transparent);
    padding:18px 16px 10px;border-bottom:1px solid var(--line);}
  .topbar h1{font-size:30px;letter-spacing:.08em;margin:0 0 4px;color:var(--accent);text-transform:uppercase;font-weight:700;}
  .topbar .sub{font-size:11px;color:var(--dim);letter-spacing:.03em;}
  .tabs{display:flex;gap:2px;margin-top:12px;background:var(--panel);border-radius:10px;padding:3px;}
  .tab{flex:1;text-align:center;padding:10px 2px;font-size:19px;border-radius:8px;color:var(--dim);
    cursor:pointer;font-weight:600;letter-spacing:.02em;}
  .tab.active{background:var(--accent-dim);color:var(--accent);}
  .content{flex:1;padding:14px 16px 100px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .card h2{font-size:18px;color:var(--dim);letter-spacing:.08em;margin:0 0 10px;text-transform:uppercase;font-weight:700;}
  .search-wrap{position:relative;}
  input[type=text],input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:12px;font-size:22.5px;outline:none;}
  input::placeholder{font-size:15px;}
  input:focus{border-color:var(--accent);}
  .dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;max-height:260px;overflow-y:auto;z-index:30;
    box-shadow:0 12px 28px rgba(0,0,0,.5);}
  .drow{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
    border-bottom:1px solid var(--line);}
  .drow:last-child{border-bottom:none;}
  .drow.hi{background:var(--panel);}
  .drow .nm{font-size:21px;} .drow .tk{font-size:16.5px;color:var(--dim);}
  .selected-chip{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);
    border:1px solid var(--accent-dim);border-radius:10px;padding:10px 12px;margin-top:8px;}
  .selected-chip .nm{font-weight:700;font-size:21.75px;}
  .selected-chip .tk{font-size:16.5px;color:var(--dim);margin-left:6px;}
  .selected-chip .x{color:var(--dim);cursor:pointer;font-size:24px;padding:2px 6px;}
  .price-row{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px;}
  .price-row .cur{font-size:39px;font-weight:700;}
  .price-row .chg{font-size:19.5px;font-weight:600;}
  .up{color:var(--up);} .down{color:var(--down);}
  .trend-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
  .trend-cell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;}
  .trend-cell.clickable{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .trend-cell.clickable.active{border-color:#ff4d4f;background:rgba(255,77,79,.08);}
  .trend-cell .lab{font-size:15px;color:var(--dim);margin-bottom:3px;letter-spacing:.04em;}
  .trend-cell .val{font-size:18.75px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;}
  .trend-cell .arrow-line{font-size:15px;}
  .trend-cell .pct-line{font-size:18.75px;}
  .target-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .field label{font-size:16.5px;color:var(--dim);display:block;margin-bottom:5px;font-weight:600;}
  .btn{background:var(--accent);color:#032b22;border:none;border-radius:10px;padding:12px;font-size:21.75px;
    font-weight:700;width:100%;cursor:pointer;margin-top:14px;}

const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function getChosung(str){
  let out = "";
  for (const ch of str){
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code >= 0 && code <= 11171) out += CHO[Math.floor(code / 588)];
    else out += ch;
  }
  return out;
}
function isChosungOnly(str){ return [...str].every(c => CHO.includes(c) || c === " "); }
function matchesQuery(name, ticker, query){
  if (!query) return true;
  const q = query.trim().toLowerCase();
  if (ticker.toLowerCase().includes(q)) return true;
  if (name.toLowerCase().includes(q)) return true;
  if (isChosungOnly(query)) return getChosung(name).includes(query.trim());
  return false;
}

/* ================= KIS 실시간 시세 연동 =================
   서버(kkm-mwrc.onrender.com)의 /price/:code, /stock-history/:code 를
   통해 실제 시세를 가져옵니다. 결과는 priceCache에 잠시 저장해두고
   재사용합니다 (너무 자주 KIS API를 호출하지 않도록). */
const KIS_SERVER = "https://kkm-mwrc.onrender.com";
const PRICE_CACHE_TTL = 15000; // 15초 이내 재요청이면 캐시 재사용

async function fetchPrice(ticker){
  const res = await fetch(KIS_SERVER + "/price/" + ticker);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "시세 조회 실패");
  return data;
}

async function fetchHistory(ticker, period, days){
  const p = period || "D";
  const d = days || 400;
  const res = await fetch(KIS_SERVER + "/stock-history/" + ticker + "?period=" + p + "&days=" + d);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "히스토리 조회 실패");
  return data.candles || [];
}

function computeTrends(candles, currentPrice, prevClose){
  function closeApproxDaysAgo(daysAgo){
    if (!candles || candles.length === 0) return null;
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() - daysAgo);
    const targetStr = targetDate.toISOString().slice(0,10).replace(/-/g,"");
    let best = null;
    for (const c of candles){
      if (c.date <= targetStr) best = c; else break;
    }
    if (!best) best = candles[0];
    return Number(best.close);
  }
  function pct(daysAgo){
    const base = closeApproxDaysAgo(daysAgo);
    if (!base) return 0;
    return Math.round(((currentPrice - base) / base) * 1000) / 10;
  }
  const dayPct = prevClose ? Math.round(((currentPrice - prevClose) / prevClose) * 1000) / 10 : pct(1);
  return { day: dayPct, week: pct(7), month: pct(30), year: pct(365) };
}

async function ensurePriceData(ticker, forceRefresh){
  const cached = state.priceCache[ticker];
  const now = Date.now();
  if (cached && cached.loading) return cached;
  if (!forceRefresh && cached && !cached.error && (now - (cached.fetchedAt||0)) < PRICE_CACHE_TTL) return cached;

  state.priceCache[ticker] = { ...(state.priceCache[ticker]||{}), loading: true };
  try{
    const [priceData, candles] = await Promise.all([
      fetchPrice(ticker),
      fetchHistory(ticker).catch(()=>[]),
    ]);
    const trends = computeTrends(candles, priceData.price, priceData.prevClose);
    state.priceCache[ticker] = {
      price: priceData.price,
      prevClose: priceData.prevClose,
      name: priceData.name,
      trends,
      loading: false,
      error: null,
      fetchedAt: Date.now(),
    };
  } catch(err){
    state.priceCache[ticker] = { loading: false, error: err.message, fetchedAt: Date.now() };
  }
  checkTargetsForTicker(ticker);
  if (state.tab === "watch" || state.tab === "add") render();
  return state.priceCache[ticker];
}

function checkTargetsForTicker(ticker){
  const cache = state.priceCache[ticker];
  if (!cache || cache.error || cache.price == null) return;
  const p = cache.price;
  let changed = false;
  state.watchlist.forEach(item=>{
    if (item.ticker !== ticker) return;
    if (item.buyTarget && !item.buyFired && p <= item.buyTarget){
      item.buyFired = true; changed = true;
      const msg = `${item.name}, 매수 목표가 ${fmt(item.buyTarget)}원에 도달했습니다.`;
      speak(msg, item.voiceURI); showToast(msg);
    }
    if (item.sellTarget && !item.sellFired && p >= item.sellTarget){
      item.sellFired = true; changed = true;
      const msg = `${item.name}, 매도 목표가 ${fmt(item.sellTarget)}원에 도달했습니다.`;
      speak(msg, item.voiceURI); showToast(msg);
    }
  });
  if (changed) saveWatch(state.watchlist);
}

/* ================= 일봉/주봉/월봉/년봉 비교 차트 =================
   선택한 종목의 가격 흐름을 코스피(0001)·코스닥(1001)과 함께
   기간 시작 시점 대비 등락률(%)로 정규화해서 같은 차트에 겹쳐 보여줍니다. */
const CHART_PERIODS = [
  { key: "D", label: "일봉", days: 30 },
  { key: "W", label: "주봉", days: 150 },
  { key: "M", label: "월봉", days: 750 },
  { key: "Y", label: "년봉", days: 3700 },
];

async function fetchIndexHistory(code, period, days){
  const res = await fetch(KIS_SERVER + "/index-history/" + code + "?period=" + period + "&days=" + days);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "지수 히스토리 조회 실패");
  return data.candles || [];
}

function toPctSeries(candles){
  if (!candles || candles.length === 0) return [];
  const first = Number(candles[0].close);
  if (!first) return [];
  return candles.map(c => ((Number(c.close) - first) / first) * 100);
}

const indexHistoryPromises = {};
async function ensureIndexHistory(code, period, days){
  const cacheKey = code + "_" + period;
  const cached = state.indexCache[cacheKey];
  if (cached && cached.fetchedAt) return cached;
  if (indexHistoryPromises[cacheKey]) return indexHistoryPromises[cacheKey];

  const p = (async () => {
    state.indexCache[cacheKey] = { loading: true };
    try{
      const candles = await fetchIndexHistory(code, period, days);
      state.indexCache[cacheKey] = { loading: false, error: null, pct: toPctSeries(candles), fetchedAt: Date.now() };
    } catch(err){
      state.indexCache[cacheKey] = { loading: false, error: err.message, fetchedAt: Date.now() };
    }
    delete indexHistoryPromises[cacheKey];
    return state.indexCache[cacheKey];
  })();
  indexHistoryPromises[cacheKey] = p;
  return p;
}

async function ensureChartData(ticker, period, days){
  const cacheKey = ticker + "_" + period;
  const cached = state.chartCache[cacheKey];
  if (cached && (cached.loading || cached.fetchedAt)) return cached;

  state.chartCache[cacheKey] = { loading: true };
  try{
    const [stockCandles, kospiEntry, kosdaqEntry] = await Promise.all([
      fetchHistory(ticker, period, days),
      ensureIndexHistory("0001", period, days),
      ensureIndexHistory("1001", period, days),
    ]);
    state.chartCache[cacheKey] = {
      loading: false,
      error: null,
      stock: toPctSeries(stockCandles),
      kospi: kospiEntry.pct || [],
      kosdaq: kosdaqEntry.pct || [],
      fetchedAt: Date.now(),
    };
  } catch(err){
    state.chartCache[cacheKey] = { loading: false, error: err.message, fetchedAt: Date.now() };
  }
  if (state.tab === "add" && state.pickedStock && state.pickedStock.ticker === ticker) render();
  return state.chartCache[cacheKey];
}

function buildMiniChartSVG(seriesList){
  const W = 300, H = 84, PAD = 4;
  let allVals = [];
  seriesList.forEach(s => { if (s.points && s.points.length) allVals = allVals.concat(s.points); });
  if (allVals.length < 2) return `<div class="status-banner">차트 데이터가 부족합니다.</div>`;
  const min = Math.min(...allVals);
  const max = Math.max(...allVals);
  const range = (max - min) || 1;
  function toPath(points){
    if (!points || points.length < 2) return "";
    const n = points.length;
    return points.map((v,i)=>{
      const x = PAD + (i/(n-1)) * (W - PAD*2);
      const y = PAD + (1 - (v-min)/range) * (H - PAD*2);
      return `${i===0?"M":"L"}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
  }
  const zeroY = (PAD + (1 - (0-min)/range) * (H - PAD*2)).toFixed(1);
  const lines = seriesList.map(s => {
    if (!s.points || s.points.length < 2) return "";
    const dashAttr = s.dash ? ` stroke-dasharray="${s.dash}"` : "";
    return `<path d="${toPath(s.points)}" fill="none" stroke="${s.color}" stroke-width="${s.width||1.6}"${dashAttr} stroke-linecap="round" stroke-linejoin="round" />`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px;display:block;">
    <line x1="0" y1="${zeroY}" x2="${W}" y2="${zeroY}" stroke="#232b35" stroke-width="1" stroke-dasharray="3,3" />
    ${lines}
  </svg>`;
}

function legendSwatch(color, width, dash){
  const dashAttr = dash ? ` stroke-dasharray="${dash}"` : "";
  return `<svg width="18" height="10" style="vertical-align:middle;margin-right:4px;"><line x1="1" y1="5" x2="17" y2="5" stroke="${color}" stroke-width="${width}"${dashAttr} /></svg>`;
}

function chartLegendHTML(stockName, stockColor){
  return `<div style="display:flex;gap:14px;font-size:10.5px;color:var(--dim);margin-top:6px;flex-wrap:wrap;align-items:center;">
    <span style="display:flex;align-items:center;">${legendSwatch(stockColor || "#ff4d4f",2.6)}${esc(stockName)}</span>
    <span style="display:flex;align-items:center;">${legendSwatch("#9aa5b1",1.5)}코스피</span>
    <span style="display:flex;align-items:center;">${legendSwatch("#9aa5b1",1.5,"5,3")}코스닥</span>
  </div>`;
}

function renderChartsSection(ticker, stockName){
  const period = CHART_PERIODS.find(p => p.key === state.chartPeriod) || CHART_PERIODS[0];
  ensureChartData(ticker, period.key, period.days);
  CHART_PERIODS.forEach(p => { if (p.key !== period.key) ensureChartData(ticker, p.key, p.days); });

  const cache = state.chartCache[ticker + "_" + period.key];
  let html = `<div style="margin-top:14px;">
    <div style="font-size:12px;color:var(--dim);margin-bottom:4px;font-weight:600;">${period.label}</div>`;
  if (!cache || cache.loading){
    html += `<div class="status-banner">차트 불러오는 중…</div>`;
  } else if (cache.error){
    html += `<div class="status-banner" style="color:var(--up);">차트 조회 실패: ${esc(cache.error)}</div>`;
  } else {
    const stockUp = cache.stock && cache.stock.length ? cache.stock[cache.stock.length - 1] >= 0 : true;
    const stockColor = stockUp ? "#ff4d4f" : "#3b82f6";
    html += buildMiniChartSVG([
      { color: "#9aa5b1", width: 1.5, points: cache.kospi },
      { color: "#9aa5b1", width: 1.5, dash: "5,3", points: cache.kosdaq },
      { color: stockColor, width: 2.6, points: cache.stock },
    ]);
    html += chartLegendHTML(stockName, stockColor);
  }
  html += `</div>`;
  return html;
}

const MALE_HINTS = ["injoon","male","남자","남성","minsu","daniel","fred","alex","tom","aaron","gordon"];
function guessGender(voice){
  const n = (voice.name||"").toLowerCase();
  if (FEMALE_HINTS.some(h=>n.includes(h))) return "female";
  if (MALE_HINTS.some(h=>n.includes(h))) return "male";
  return "unknown";
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmt(n){ return Number(n).toLocaleString("ko-KR"); }

function trendCellHTML(label, value, periodKey){
  const isUp = value >= 0;
  const cls = periodKey ? `trend-cell clickable${state.chartPeriod===periodKey?" active":""}` : "trend-cell";

    html += `
      <div class="search-wrap">
        <input type="text" id="stockSearch" placeholder="종목명 또는 초성 입력 (예: 삼전, ㅅㅅㅈㅈ)" value="${esc(state.searchQuery)}" autocomplete="off" />
        <div id="dropdownHost"></div>
      </div>`;
  } else {
    const s = state.pickedStock;
    ensurePriceData(s.ticker);
    const cache = state.priceCache[s.ticker];
    html += `
      <div class="selected-chip">
        <span><span class="nm">${esc(s.name)}</span><span class="tk mono"> ${esc(s.ticker)}</span></span>
        <span class="x" id="clearStock">✕</span>
      </div>`;
    if (!cache || cache.loading){
      html += `<div class="status-banner" style="margin-top:10px;">시세 조회 중…</div>`;
    } else if (cache.error){
      html += `<div class="status-banner" style="margin-top:10px;color:var(--up);">시세 조회 실패: ${esc(cache.error)}</div>`;
    } else {
      html += `
      <div class="price-row">
        <span class="cur mono">${fmt(cache.price)}<span style="font-size:19.5px;color:var(--dim);font-weight:400;"> 원</span></span>
        <span class="chg mono ${cache.trends.day>=0?"up":"down"}">${cache.trends.day>=0?"▲":"▼"} ${Math.abs(cache.trends.day).toFixed(1)}%</span>
      </div>
      <div class="trend-grid">
        ${trendCellHTML("일간", cache.trends.day, "D")}
        ${trendCellHTML("주간", cache.trends.week, "W")}
        ${trendCellHTML("월간", cache.trends.month, "M")}
        ${trendCellHTML("년간", cache.trends.year, "Y")}
      </div>
      ${renderChartsSection(s.ticker, s.name)}`;
    }
    html += `
      <div class="target-grid">
        <div class="field">
          <label>매수 알림가 (원)</label>
          <input type="number" inputmode="numeric" id="buyInput" placeholder="매수금액" value="${esc(state.buyInput)}" />
        </div>
        <div class="field">
          <label>매도 알림가 (원)</label>
          <input type="number" inputmode="numeric" id="sellInput" placeholder="매도금액" value="${esc(state.sellInput)}" />
        </div>
      </div>
      <button class="btn" id="submitAlert" ${(!state.buyInput && !state.sellInput)?"disabled":""}>알림 등록</button>
    `;
  }
  html += `</div>`;
  contentEl.innerHTML = html;

  if (!state.pickedStock){
    const input = document.getElementById("stockSearch");
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    renderDropdown();
    input.addEventListener("input", e=>{
      state.searchQuery = e.target.value;
      state.searchOpen = true;
      renderDropdown();
    });
    input.addEventListener("focus", ()=>{ state.searchOpen = true; renderDropdown(); });
  } else {
    document.querySelectorAll(".trend-cell.clickable").forEach(cell=>{
      cell.addEventListener("click", ()=>{
        state.chartPeriod = cell.getAttribute("data-period");
        renderAdd();
      });
    });
    document.getElementById("clearStock").addEventListener("click", ()=>{
      state.pickedStock = null; state.buyInput = ""; state.sellInput = ""; state.searchQuery = "";
      renderAdd();
    });
    document.getElementById("buyInput").addEventListener("input", e=>{
      state.buyInput = e.target.value;
      document.getElementById("submitAlert").disabled = !state.buyInput && !state.sellInput;
    });
    document.getElementById("sellInput").addEventListener("input", e=>{
      state.sellInput = e.target.value;
      document.getElementById("submitAlert").disabled = !state.buyInput && !state.sellInput;
    });
    document.getElementById("submitAlert").addEventListener("click", ()=>{
      const s = state.pickedStock;
      state.watchlist.unshift({
        id: Date.now()+"_"+s.ticker,
        ticker: s.ticker,
        name: s.name,
        buyTarget: state.buyInput ? Number(state.buyInput) : null,
        sellTarget: state.sellInput ? Number(state.sellInput) : null,
        buyFired: false,
        sellFired: false,
        voiceURI: state.voiceURI,
      });
      saveWatch(state.watchlist);
      state.pickedStock = null; state.buyInput = ""; state.sellInput = ""; state.searchQuery = "";
      setTab("watch");
    });
  }
}

function renderDropdown(){
  const host = document.getElementById("dropdownHost");
  if (!host) return;
  const q = state.searchQuery;
  if (!state.searchOpen || !q.trim()){ host.innerHTML = ""; return; }
  const results = STOCK_LIST.filter(s => matchesQuery(s.name, s.ticker, q)).slice(0, 30);
  if (results.length === 0){ host.innerHTML = ""; return; }
  host.innerHTML = `<div class="dropdown">${results.map(s=>`
    <div class="drow" data-ticker="${esc(s.ticker)}">
      <span class="nm">${esc(s.name)}</span>
      <span class="tk mono">${esc(s.ticker)}</span>
    </div>`).join("")}</div>`;
  host.querySelectorAll(".drow").forEach(row=>{
    row.addEventListener("mousedown", e=>{
      e.preventDefault();
      const tk = row.getAttribute("data-ticker");
      const s = STOCK_LIST.find(x=>x.ticker===tk);
      state.pickedStock = s; state.searchOpen = false; state.searchQuery = ""; state.chartPeriod = "D";
      renderAdd();
    });
  });
}

/* ================= 렌더: 감시 목록 탭 ================= */
function renderWatch(){
  if (state.watchlist.length === 0){
    contentEl.innerHTML = `<div class="empty">등록된 알림이 없습니다.<br/>'알림 등록' 탭에서 종목과 목표가를 설정해 보세요.</div>`;
    return;
  }
  contentEl.innerHTML = state.watchlist.map(item=>{
    ensurePriceData(item.ticker);
    const cache = state.priceCache[item.ticker];
    const fired = item.buyFired || item.sellFired;
    const priceHTML = (!cache || cache.loading)
      ? `<div class="wi-price mono" style="font-size:16px;color:var(--dim);">조회중…</div>`
      : cache.error
        ? `<div class="wi-price mono" style="font-size:14px;color:var(--up);">조회 실패</div>`
        : `<div class="wi-price mono">${fmt(cache.price)}</div>`;
    const trendsHTML = (!cache || cache.loading || cache.error) ? "" : `
      <div class="trend-grid" style="margin-top:10px;">
        ${trendCellHTML("일간", cache.trends.day)}
        ${trendCellHTML("주간", cache.trends.week)}
        ${trendCellHTML("월간", cache.trends.month)}
        ${trendCellHTML("년간", cache.trends.year)}
      </div>`;
    return `
    <div class="watch-item ${fired?"fired":""}" data-id="${item.id}">
      ${fired?`<div class="fired-badge">알림 발생</div>`:""}
      <div class="wi-top">
        <div><div class="wi-name">${esc(item.name)}</div><div class="wi-tk mono">${esc(item.ticker)}</div></div>
        ${priceHTML}
      </div>
      ${trendsHTML}
      <div class="wi-targets">
        ${item.buyTarget?`<span class="t">매수 <b class="mono">${fmt(item.buyTarget)}</b>${item.buyFired?" ✓":""}</span>`:""}
        ${item.sellTarget?`<span class="t">매도 <b class="mono">${fmt(item.sellTarget)}</b>${item.sellFired?" ✓":""}</span>`:""}
      </div>
      <div class="wi-actions">
        ${fired?`<span class="pill reset" data-action="reset" data-id="${item.id}">다시 감시</span>`:""}
        <span class="pill danger" data-action="remove" data-id="${item.id}">삭제</span>
      </div>
    </div>`;
  }).join("");

  contentEl.querySelectorAll("[data-action='remove']").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.watchlist = state.watchlist.filter(i=>i.id!==el.getAttribute("data-id"));
      saveWatch(state.watchlist);
      renderWatch();
      updateTabLabels();
    });
  });
  contentEl.querySelectorAll("[data-action='reset']").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.getAttribute("data-id");
      state.watchlist = state.watchlist.map(i => i.id===id ? {...i, buyFired:false, sellFired:false} : i);
      saveWatch(state.watchlist);
      renderWatch();
    });
  });
}

/* ================= 렌더: 음성 설정 탭 ================= */
function renderVoice(){
  const groups = { female: [], male: [], unknown: [] };
  state.voices.forEach(v => groups[guessGender(v)].push(v));

  function rowHTML(v, idx){
    const g = guessGender(v);
    const label = g==="female" ? "여성" : g==="male" ? "남성" : "확인필요";
    const sel = v.voiceURI === state.voiceURI;
    return `
      <div class="voice-item ${sel?"sel":""}" data-uri="${esc(v.voiceURI)}">
        <div class="vi-left">
          <div class="radio-dot ${sel?"on":""}"></div>
          <span class="gtag ${g}">${label}</span>
          <div><div class="vname">${esc(v.name)}</div><div class="vlang mono">${esc(v.lang)}</div></div>
        </div>
        <div class="play-btn" data-preview="${esc(v.voiceURI)}">▶</div>
      </div>`;
  }

  let html = `
    <div class="status-banner">
      기기·브라우저에 설치된 음성 목록입니다. ▶ 버튼으로 미리 들어본 뒤 사용할 목소리를 선택하세요.
      한국어 음성이 목록에 없다면 기기 설정 &gt; 손쉬운 사용(또는 접근성) &gt; 음성에서
      한국어 음성 데이터를 추가로 설치해야 합니다.
    </div>`;

  if (state.voices.length === 0){
    html += `<div class="empty">사용 가능한 음성을 불러오는 중입니다…</div>`;
  }
  if (groups.female.length){ html += `<h2 style="margin:14px 0 10px;font-size:18px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:700;">여성 목소리</h2>` + groups.female.map(rowHTML).join(""); }
  if (groups.male.length){ html += `<h2 style="margin:14px 0 10px;font-size:18px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:700;">남성 목소리</h2>` + groups.male.map(rowHTML).join(""); }
  if (groups.unknown.length){ html += `<h2 style="margin:14px 0 10px;font-size:18px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:700;">기타 / 성별 미상</h2>` + groups.unknown.map(rowHTML).join(""); }

  html += `
    <div class="card" style="margin-top:14px;">
      <h2>말하기 속도</h2>
      <input type="range" min="0.6" max="1.4" step="0.05" value="${state.speechRate}" id="rateSlider" style="width:100%;" />
      <div style="text-align:center;font-size:18px;color:var(--dim);margin-top:4px;" class="mono" id="rateLabel">${state.speechRate.toFixed(2)}x</div>
    </div>`;

  contentEl.innerHTML = html;

  contentEl.querySelectorAll(".voice-item").forEach(el=>{
    el.addEventListener("click", (e)=>{
      if (e.target.closest(".play-btn")) return;
      state.voiceURI = el.getAttribute("data-uri");
      localStorage.setItem(LS_VOICE, state.voiceURI);
      renderVoice();
    });
  });
  contentEl.querySelectorAll(".play-btn").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const uri = el.getAttribute("data-preview");
      const v = state.voices.find(v=>v.voiceURI===uri);
      previewVoice(v);
    });
  });
  const slider = document.getElementById("rateSlider");
  slider.addEventListener("input", e=>{
    state.speechRate = Number(e.target.value);
    document.getElementById("rateLabel").textContent = state.speechRate.toFixed(2)+"x";
  });
}

function previewVoice(v){
  if (!window.speechSynthesis || !v) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance("삼성전자, 매수 목표가 팔만 원에 도달했습니다.");
  u.voice = v; u.lang = v.lang || "ko-KR"; u.rate = state.speechRate;
  window.speechSynthesis.speak(u);
}

function speak(text, uri){
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = state.voices.find(v=>v.voiceURI===uri) || state.voices.find(v=>v.voiceURI===state.voiceURI);
  if (v){ u.voice = v; u.lang = v.lang; } else { u.lang = "ko-KR"; }
  u.rate = state.speechRate;
  window.speechSynthesis.speak(u);
}

function showToast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = "🔊 " + msg;
  toastWrap.innerHTML = "";
  toastWrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 4000);
}

/* ================= 탭 전환 ================= */
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active", t.getAttribute("data-tab")===tab);
  });
  render();
}
function updateTabLabels(){
  const watchTab = document.querySelector('.tab[data-tab="watch"]');
  watchTab.textContent = state.watchlist.length>0 ? `감시 목록 (${state.watchlist.length})` : "감시 목록";
}
function render(){
  if (state.tab==="add") renderAdd();
  else if (state.tab==="watch") renderWatch();
  else if (state.tab==="voice") renderVoice();
  updateTabLabels();
}

document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=> setTab(t.getAttribute("data-tab")));
});

/* ================= 음성 목록 로드 ================= */
function loadVoices(){
  const list = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  const ko = list.filter(v => v.lang && v.lang.toLowerCase().startsWith("ko"));
  state.voices = ko.length ? ko : list;
  if (state.tab==="voice") renderVoice();
}
if (window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

/* ================= 실시간 시세 폴링 =================
   KIS API 호출 빈도를 고려해 15초 간격으로 감시 중인 종목들의 시세를 갱신합니다.
   목표가 도달 체크는 ensurePriceData 내부(checkTargetsForTicker)에서 처리됩니다. */
setInterval(()=>{
  if (state.watchlist.length === 0) return;
  const tickers = [...new Set(state.watchlist.map(i=>i.ticker))];
  tickers.forEach(t => ensurePriceData(t, true));
}, 15000);

/* ================= 초기 렌더 ================= */
render();
</script>
</body>
</html>
